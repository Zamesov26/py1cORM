[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "py1cORM"
version = "0.1.0"
authors = [
  { name="Oleg Zamesov", email="o.zamesov@yandex.ru" },
]
dependencies = [
  "python-dateutil>=2.9",
  "requests>=2.32",
]
description = "ORM for 1C"
readme = "README.md"
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Development Status :: 4 - Beta",
]

[project.urls]
Homepage = "https://github.com/Zamesov26/py1cORM"
AuthorGitHub = "https://github.com/Zamesov26"

[project.optional-dependencies]
dev = [
    "python-semantic-release>=10.7,<11",
    "pytest>=9.1,<10",
    "ruff==0.16.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["py1cORM*"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    "**/__pycache__/**",
    ".venv/",
    "venv/",
    ".pytest_cache/",
    ".mypy_cache/",
    ".ruff_cache/",
]

[tool.ruff.lint]
ignore = [
    "E501",
    "D105", # Magic methods are self-describing.
    "D106", # Nested Meta classes configure models.
    "D107", # Constructors are described by classes and signatures.
]
select = [
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # Pyflakes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "I", # isort
    "C", # flake8-comprehensions
    "PT", # flake8-pytest-style
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): {version}"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
